<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chess Game</title>
<style>
    body {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
        background-color: #ccc;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        overflow: hidden;
    }

    #chessboard {
        display: grid;
        grid-template-columns: repeat(8, 70px);
        grid-template-rows: repeat(8, 70px);
        border: 4px solid #333;
        box-shadow: 0 0 20px rgba(0,0,0,0.5);
        z-index: 1;
    }

    .cell {
        width: 70px;
        height: 70px;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 50px;
        cursor: pointer;
        user-select: none;
        transition: all 0.2s ease;
    }

    .white {
        background: linear-gradient(145deg, #f3d9b5, #e6c89f);
    }

    .black {
        background: linear-gradient(145deg, #b58863, #a0522d);
    }

    .white-piece {
        color: #fff;
        text-shadow: 1px 1px 2px #000, 0 0 5px #000;
        font-weight: bold;
    }

    .black-piece {
        color: #000;
        text-shadow: 1px 1px 2px #fff, 0 0 3px #fff;
        font-weight: bold;
    }

    .selected {
        outline: 4px solid yellow;
        z-index: 2;
    }

    /* Game Over overlay */
    #gameOverOverlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: rgba(0,0,0,0.85);
        display: flex;
        justify-content: center;
        align-items: center;
        color: #fff;
        font-size: 60px;
        font-weight: bold;
        text-align: center;
        opacity: 0;
        pointer-events: none;
        z-index: 10;
        animation: glow 1.5s infinite alternate;
    }

    @keyframes glow {
        0% { text-shadow: 0 0 10px #fff, 0 0 20px #ff0, 0 0 30px #ff0, 0 0 40px #ff0; }
        50% { text-shadow: 0 0 20px #fff, 0 0 30px #ff0, 0 0 40px #ff0, 0 0 50px #ff0; }
        100% { text-shadow: 0 0 30px #fff, 0 0 40px #ff0, 0 0 50px #ff0, 0 0 60px #ff0; }
    }
</style>
</head>
<body>

<div id="chessboard"></div>
<div id="gameOverOverlay"></div>

<script src="funtion.js"></script>

</body>
</html>
